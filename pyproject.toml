[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "leveledge"
version = "2.0.0"
description = "Calibrated probabilities that a stock or crypto price closes above a level at a target time"
readme = "README.md"
requires-python = ">=3.10"
authors = [
{ name = "Krish Patel" }
]
dependencies = [
  "pandas",
  "scikit-learn",
  "yfinance",
  "numpy",
  "xgboost",
  "pandas-market-calendars",
  "python-dotenv",
  "supabase",
  "polygon-api-client",
  "scipy",
]

[project.optional-dependencies]
web = ["fastapi", "uvicorn[standard]"]
dev = ["pytest", "httpx"]

[tool.setuptools.packages.find]
where = ["src"]
