# .github/workflows/run_forwardtest.yml
name: Forward Test

on:
  schedule:
    - cron: '0 14 * * 1-5'   # 10:00 AM EDT (UTC-4)
    - cron: '0 16 * * 1-5'   # 12:00 PM EDT (UTC-4)
    - cron: '0 18 * * 1-5'   #  2:00 PM EDT (UTC-4)
  workflow_dispatch:          # allow manual trigger from GitHub UI

concurrency:                  # never run two forward tests at once; never cancel one mid-run
  group: forward-test
  cancel-in-progress: false

permissions:
  contents: write             # append to the public `ledger` branch

jobs:
  forward-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30       # v2 fits once per ticker × interval (~2 s each)

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install --no-deps .

      - name: Run forward test
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scripts/forwardtest.py --ledger-out "$RUNNER_TEMP/ledger_forecasts.json"

      - name: Commit forecasts to the verifiable ledger
        # Appended before the 4 PM target and timestamped by freetsa.org in the same push.
        run: |
          if [ -s "$RUNNER_TEMP/ledger_forecasts.json" ]; then
            bash scripts/ledger_push.sh "Ledger: forecasts made $(TZ=America/New_York date '+%Y-%m-%d %H:%M ET')" \
              append --bodies "$RUNNER_TEMP/ledger_forecasts.json" --anchor
          else
            echo "No forecasts this run (market closed)."
          fi

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: forward-test-logs-${{ github.run_id }}
          path: '*.log'
          retention-days: 7